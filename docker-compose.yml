version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: morfeu-postgres
    env_file: .env.docker-compose
    environment:
      POSTGRES_DB: morfeu
    ports:
      - "5432:5432"
    volumes:
      - morfeu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morfeu-network

  redis:
    image: redis:7-alpine
    container_name: morfeu-redis
    ports:
      - "6379:6379"
    volumes:
      - morfeu-redis:/data
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morfeu-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: morfeu-rabbitmq
    env_file: .env.docker-compose
    ports:
      - "5672:5672"
      # UI de management só em localhost (RNF02) — nunca exposta na rede.
      - "127.0.0.1:15672:15672"
    volumes:
      - morfeu-rabbitmq:/var/lib/rabbitmq
      - ./configs/rabbitmq.conf:/etc/rabbitmq/conf.d/10-morfeu.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morfeu-network

volumes:
  morfeu-postgres:
  morfeu-redis:
  morfeu-rabbitmq:

networks:
  morfeu-network:
    driver: bridge
