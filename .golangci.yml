run:
  timeout: 5m
  deadline: 10m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - errorlint
    - gosec
    - gocognit
    - nestif
    - funlen
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - depguard
    - exhaustive
  disable-all: false

linters-settings:
  gocognit:
    min-complexity: 15

  funlen:
    lines: 80
    statements: 50

  nestif:
    min-complexity: 5

  revive:
    ignore-generated-header: true
    severity: error
    rules:
      - name: blank-imports
        severity: error
      - name: context-as-argument
        severity: error
      - name: context-keys-type
        severity: error
      - name: early-return
        severity: warning
      - name: indent-error-flow
        severity: warning
      - name: superfluous-else
        severity: warning

  depguard:
    rules:
      main:
        deny:
          - name: io/ioutil
            recommendations:
              - io
              - os

issues:
  exclude-use-default: false
  max-same-issues: 10
  max-per-linter: 100

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
