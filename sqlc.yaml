version: "2"
sql:
  - schema: "./migrations"
    queries: "./internal/catalogo/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "./internal/catalogo/db"
        package: "db"
        emit_db_tags: true
        emit_interface: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
