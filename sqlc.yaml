version: "1"
settings:
  schema: "./migrations"
  queries: "./internal/db/queries.sql"
  engine: "postgresql"
  gen:
    go:
      out: "./internal/db"
      package: "db"
      emit_db_tags: true
      emit_interface: true
      emit_marshaler: false
      emit_pointers: false
      emit_prepared_queries: false
      emit_exact_table_names: false
      sql_package: "pgx/v5"
